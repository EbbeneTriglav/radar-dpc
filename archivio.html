<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar DPC — Archivio dati</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=20260518j">
</head>
<body>

<!-- ── Top Bar ─────────────────────────────────────────── -->
<nav id="topbar">
  <div class="logo">
    <i class="fa fa-database"></i>
    RADAR<span style="color:var(--text2);font-weight:300">·</span>ARCHIVIO
  </div>

  <div class="nav-links">
    <a href="index.html" class="nav-link">🗺 Mappa Live</a>
    <a href="storico.html" class="nav-link">📊 Storico</a>
    <a href="archivio.html" class="nav-link active">🗄 Archivio</a>
    <a href="monitor.html" class="nav-link">🚨 Monitor</a>
    <a href="eventi.html" class="nav-link">📋 Eventi</a>
    <a href="arpa.html" class="nav-link">📡 ARPA</a>
    <a href="verifica.html" class="nav-link">✅ Verifica</a>
  </div>

  <div class="spacer"></div>

  <button class="topbar-btn" id="btn-timezone" title="Cambia fuso orario">
    <i class="fa fa-globe"></i> <span class="tz-label">Locale</span>
  </button>
  <a class="topbar-btn" href="https://github.com/ebbenetriglav/radar-dpc" target="_blank" title="Repository">
    <i class="fa fa-code-branch"></i>
  </a>
</nav>

<!-- ── Area principale full-screen ──────────────────────── -->
<div id="archive-fullscreen-app">
  <div id="tab-archive"></div>
</div>

<!-- Librerie -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<!-- Moduli app -->
<script src="js/timezone.js?v=20260518j"></script>
<script src="js/basemap-picker.js?v=20260518j"></script>
<script src="js/config.js?v=20260518j"></script>
<script src="js/archive-tab.js?v=20260518j"></script>

<!-- Bootstrap pagina -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Stili full-screen per la pagina dedicata
  const css = document.createElement('style');
  css.textContent = `
    body { overflow: hidden; }
    #archive-fullscreen-app {
      position: fixed;
      top: 50px;   /* altezza topbar */
      left: 0; right: 0; bottom: 0;
      background: var(--bg);
      overflow: hidden;
    }
    #tab-archive {
      width: 100%;
      height: 100%;
      display: flex !important;
      flex-direction: column;
    }
    .archive-body {
      flex: 1;
      min-height: 0;
    }
    .archive-mini-map {
      min-height: 400px !important;
    }
  `;
  document.head.appendChild(css);

  // Toggle UTC/Locale
  const btn = document.getElementById('btn-timezone');
  if (btn) {
    function refresh() {
      const lbl = btn.querySelector('.tz-label');
      if (lbl) lbl.textContent = Timezone.mode === 'utc' ? 'UTC' : 'Locale';
    }
    refresh();
    btn.addEventListener('click', () => Timezone.toggle());
    window.addEventListener('timezone-changed', refresh);
  }

  // Avvia il modulo Archivio
  ArchiveTab.init().catch(e => console.error('[archive] init err:', e));
});
</script>

</body>
</html>
