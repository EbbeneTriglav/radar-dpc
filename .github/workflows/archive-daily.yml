name: Archive Radar Data

# Esegue ogni 6 ore (00:00, 06:00, 12:00, 18:00 UTC)
# Scarica i dati radar DPC per le aree configurate e li archivia nel repo.
#
# Si può anche lanciare a mano dalla tab "Actions" → "Archive Radar Data" →
# "Run workflow", specificando "days" per il bootstrap iniziale (es. 7).

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Quanti giorni a ritroso recuperare (1-30, default 1)'
        default: '2'
        type: string
      force:
        description: 'Sovrascrivi righe esistenti (default false)'
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'archive/scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r archive/scripts/requirements.txt

      - name: Run collector
        run: |
          DAYS="${{ github.event.inputs.days || '3' }}"
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python archive/scripts/collect.py --days "$DAYS" --include-today $FORCE_FLAG

      - name: Commit data
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/data/
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: archive run $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            # Retry con rebase: monitor/nowcast/arpa-collect possono pushare
            # sullo stesso ref nello stesso istante. Senza questo loop il push
            # viene rifiutato (non-fast-forward), il run va in errore e i dati
            # gia' committati in locale vengono persi con il runner.
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              echo "Push fallito, retry $i/5..."
              git pull --rebase --autostash || true
              sleep $((i * 5))
            done
          fi
