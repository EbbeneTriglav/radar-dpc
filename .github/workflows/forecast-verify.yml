name: Forecast Verify

# Verifica giornaliera dell'accuratezza dei forecast (OpenMeteo + MET Norway)
# confrontandoli con l'osservato. Schedulato 1×/giorno alle 06:00 UTC.

on:
  schedule:
    - cron: '0 6 * * *'    # ogni giorno alle 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # il primo run fa il backfill di tutti gli eventi storici
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run forecast_verify
        run: python archive/scripts/forecast_verify.py

      # Archivia i pluviometri a terra (ARPA Socrata) per ogni evento nuovo,
      # cosi' verifica.html non deve interrogare l'API riga per riga e il dato
      # resta anche quando ARPA lo rimuove dal dataset realtime.
      - name: Run ground_collect
        run: python archive/scripts/ground_collect.py

      - name: Commit verification
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/data/forecast_verification.csv archive/data/ground_rain.csv archive/data/ground_index.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No verification changes."
          else
            git commit -m "forecast-verify: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            for i in 1 2 3; do
              if git push; then break; fi
              echo "Push fallito, retry $i/3..."
              git pull --rebase --autostash || true
              sleep $((i * 5))
            done
          fi
