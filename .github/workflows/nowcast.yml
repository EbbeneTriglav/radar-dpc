name: Radar Nowcast

# Nowcasting radar DPC ogni 60 minuti: rileva celle precipitanti nei buffer
# 5km e 10km attorno alle aree, ne stima moto e probabilità di arrivo.

on:
  schedule:
    - cron: '0 * * * *'        # ogni ora
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run senza notifiche'
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

concurrency:
  group: nowcast
  cancel-in-progress: false

jobs:
  nowcast:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'archive/scripts/requirements.txt'
      - run: pip install -r archive/scripts/requirements.txt
      - name: Run nowcast
        env:
          SMTP_HOST:        ${{ secrets.SMTP_HOST }}
          SMTP_PORT:        ${{ secrets.SMTP_PORT }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          SMTP_TO:          ${{ secrets.SMTP_TO }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python archive/scripts/nowcast.py --dry-run
          else
            python archive/scripts/nowcast.py
          fi
      - name: Commit state and events
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/state/ archive/data/events.csv archive/data/last_observations.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "nowcast: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            for i in 1 2 3; do git push && break; git pull --rebase --autostash || true; sleep $((i*5)); done
          fi
