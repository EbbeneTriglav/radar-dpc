name: Forecast 24h Alert

on:
  schedule:
    # Ogni 2 ore (minuto sfalsato): la logica in forecast_matrix.py evita spam
    # (1 mail/giorno per soglia + escalation) ma invia SUBITO su cambio repentino
    # delle previsioni (worst-case +20mm e +50% vs run precedente).
    - cron: '37 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modalità'
        default: 'normal'
        type: choice
        options: ['normal', 'dry-run', 'test-alert', 'test-radar']

permissions:
  contents: write

concurrency:
  group: forecast-alert
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Run forecast alert
        env:
          SMTP_HOST:        ${{ secrets.SMTP_HOST }}
          SMTP_PORT:        ${{ secrets.SMTP_PORT }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          SMTP_TO:          ${{ secrets.SMTP_TO }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "test-alert" ]; then
            python archive/scripts/forecast_ensemble_alert.py --test-alert
          elif [ "$MODE" = "test-radar" ]; then
            python archive/scripts/forecast_ensemble_alert.py --test-radar
          elif [ "$MODE" = "dry-run" ]; then
            python archive/scripts/forecast_ensemble_alert.py --dry-run
          else
            python archive/scripts/forecast_ensemble_alert.py
          fi

      - name: Matrice SP3 previsionale (24/48/72h, email + Telegram)
        # Email dettagliata (matrice completa) + Telegram compatto, agli stessi
        # destinatari dell'area. Niente events.csv, niente pagine pubbliche.
        # continue-on-error: un problema qui non deve bloccare il commit
        # dello stato dell'alert 24h sopra.
        continue-on-error: true
        env:
          SMTP_HOST:        ${{ secrets.SMTP_HOST }}
          SMTP_PORT:        ${{ secrets.SMTP_PORT }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          SMTP_TO:          ${{ secrets.SMTP_TO }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "dry-run" ]; then
            python archive/scripts/forecast_matrix.py --dry-run
          elif [ "$MODE" = "normal" ] || [ -z "$MODE" ]; then
            python archive/scripts/forecast_matrix.py
          fi

      - name: Commit state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/state/ archive/data/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "forecast-24h: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              echo "Push fallito, retry $i/5..."
              git pull --rebase --autostash || true
              sleep $((i * 5))
            done
          fi
