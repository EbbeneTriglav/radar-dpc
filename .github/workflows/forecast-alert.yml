name: Forecast 24h Alert

on:
  schedule:
    - cron: '30 */6 * * *'   # ogni 6 ore (00:30, 06:30, 12:30, 18:30)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modalità'
        default: 'normal'
        type: choice
        options: ['normal', 'dry-run', 'test-alert', 'test-radar']

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Run forecast alert
        env:
          SMTP_HOST:        ${{ secrets.SMTP_HOST }}
          SMTP_PORT:        ${{ secrets.SMTP_PORT }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          SMTP_TO:          ${{ secrets.SMTP_TO }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "test-alert" ]; then
            python archive/scripts/forecast_ensemble_alert.py --test-alert
          elif [ "$MODE" = "test-radar" ]; then
            python archive/scripts/forecast_ensemble_alert.py --test-radar
          elif [ "$MODE" = "dry-run" ]; then
            python archive/scripts/forecast_ensemble_alert.py --dry-run
          else
            python archive/scripts/forecast_ensemble_alert.py
          fi

      - name: Commit state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/state/ archive/data/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "forecast-24h: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push || (git pull --rebase --autostash && git push)
          fi
