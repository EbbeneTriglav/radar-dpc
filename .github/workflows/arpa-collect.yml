name: ARPA Lombardia Collect

# Fetch dati radar ARPA Lombardia (mosaico Desio+Flero, dBZ + mm/h Marshall-Palmer)
# per Ruspino e Cepina. Schedulato ogni 5 min (cadenza nativa ARPA).
# I dati sono salvati in CSV separati (archive/data/<area>_arpa.csv).
# NESSUN ALERT in questa fase: solo raccolta parallela per check sanity vs DPC.

on:
  schedule:
    # Cadenza realistica: */5 non veniva MAI rispettato (run reali ogni 2-3h).
    # Ogni 10' sfalsato + backfill oldest-first (48 frame/run) copre i gap.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arpa-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'archive/scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r archive/scripts/requirements.txt

      - name: Run arpa_collect
        run: python archive/scripts/arpa_collect.py

      - name: Commit ARPA CSVs
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/data/*_arpa.csv archive/data/radar_arpa/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No ARPA data changes."
          else
            git commit -m "arpa-collect: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            for i in 1 2 3; do
              if git push; then break; fi
              echo "Push fallito, retry $i/3..."
              git pull --rebase --autostash || true
              sleep $((i * 5))
            done
          fi
