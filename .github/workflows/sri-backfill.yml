name: SRI Backfill / Probe
# Il titolo del run porta i parametri: lo legge backfill-watchdog.yml per rilanciare dopo un guasto.
run-name: "SRI mode=${{ inputs.mode }} round=${{ inputs.round }} retry=${{ inputs.retry || '0' }} zero=${{ inputs.zero || '0' }} frames=${{ inputs.max_frames }} auto=${{ inputs.auto }}"

# Manuale. 'probe' = verifica quanto indietro l'API DPC conserva i frame SRI
# (solo log, non scrive nulla). 'backfill-episodes' = scarica i frame SRI delle
# finestre episodio ancora disponibili (SRI_MAX_FRAMES per run, dal più recente).
# 'backfill-ring' = anello 10 km attorno a Ruspino, [inizio-3h, inizio+3h] di ogni
# episodio (dati di studio per la pre-allerta; nessuna allerta li legge).
# AUTOMATICO: con 'continua' attivo, a fine run si rilancia da solo finché restano
# frame E il run ha archiviato qualcosa (i frame oltre la memoria dell'API DPC non
# bloccano: un run a 0 frame ferma la catena). Massimo 80 giri.
# 'backfill-ring-days' = anello CONTINUO dal 15/05 per tutte le aree (~40k frame, ~40 giri
# da 1000): misura le celle passate vicino senza piovere sull'area (falsi allarmi).
# RESILIENZA: un giro a 0 frame (DPC che non risponde) viene ritentato 2 volte dopo 5';
# se un run FALLISCE (guasto GitHub, push respinto…) lo rilancia backfill-watchdog.yml
# (fino a 5 tentativi). Per fermare tutto: "Cancel run" sul run in corso.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modalità'
        default: 'probe'
        type: choice
        options: ['probe', 'backfill-episodes', 'backfill-ring', 'backfill-ring-days']
      max_frames:
        description: 'Frame massimi per run (backfill)'
        default: '1000'
      auto:
        description: 'Continua da solo finché non ha finito'
        type: boolean
        default: true
      round:
        description: 'Giro (gestito in automatico, lasciare 1)'
        default: '1'
      retry:
        description: 'Tentativo dopo un guasto (automatico, lasciare 0)'
        default: '0'
      zero:
        description: 'Giri consecutivi a 0 frame (automatico, lasciare 0)'
        default: '0'

permissions:
  contents: write
  actions: write               # per rilanciare se stesso (workflow_dispatch)

concurrency:
  group: sri-backfill          # file separati (*_sri_backfill.csv): nessun conflitto con arpa-collect
  cancel-in-progress: false

jobs:
  sri:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'archive/scripts/requirements.txt'
      - run: pip install -r archive/scripts/requirements.txt
      - name: SRI ${{ github.event.inputs.mode }} (giro ${{ inputs.round }})
        id: run
        env:
          SRI_MAX_FRAMES: ${{ github.event.inputs.max_frames }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "probe" ]; then
            python archive/scripts/sri_collect.py --probe
          elif [ "${{ github.event.inputs.mode }}" = "backfill-ring" ]; then
            python archive/scripts/sri_collect.py --backfill-ring
          elif [ "${{ github.event.inputs.mode }}" = "backfill-ring-days" ]; then
            python archive/scripts/sri_collect.py --backfill-ring-days
          else
            python archive/scripts/sri_collect.py --backfill-episodes
          fi
      - name: Commit SRI
        if: github.event.inputs.mode != 'probe'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/data/*_sri_backfill.csv 2>/dev/null || true
          git add archive/data/*_sri_ring_backfill.csv 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nessun frame nuovo."; else
            git commit -m "sri-backfill: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              git pull --rebase --autostash || true
              sleep $((i * 5))
            done
          fi
      - name: Continua automaticamente
        if: github.event.inputs.mode != 'probe' && inputs.auto
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          MAXF: ${{ inputs.max_frames }}
          ROUND: ${{ inputs.round }}
          ZERO: ${{ inputs.zero || '0' }}
          PROGRESS: ${{ steps.run.outputs.progress }}
          REMAINING: ${{ steps.run.outputs.remaining }}
        run: |
          echo "giro $ROUND: archiviati ${PROGRESS:-0}, restano ${REMAINING:-0}, giri vuoti di fila ${ZERO}"
          next() { gh workflow run sri-backfill.yml --ref main -f mode="$MODE" -f max_frames="$MAXF" \
                     -f auto=true -f round=$((ROUND + 1)) -f retry=0 -f zero="$1"; echo "rilanciato: giro $((ROUND + 1))"; }
          if [ "${REMAINING:-0}" -le 0 ] || [ "$ROUND" -ge 80 ]; then
            echo "fine catena (finito o limite giri)"
          elif [ "${PROGRESS:-0}" -gt 0 ]; then
            next 0
          elif [ "$ZERO" -lt 2 ]; then
            echo "0 frame: il DPC forse non risponde, riprovo tra 5 minuti"; sleep 300; next $((ZERO + 1))
          else
            echo "fine catena: 3 giri di fila senza frame (restano solo frame non più disponibili sul DPC)"
          fi
