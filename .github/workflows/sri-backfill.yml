name: SRI Backfill / Probe

# Manuale. 'probe' = verifica quanto indietro l'API DPC conserva i frame SRI
# (solo log, non scrive nulla). 'backfill-episodes' = scarica i frame SRI delle
# finestre episodio ancora disponibili (SRI_MAX_FRAMES per run, dal più recente).
# 'backfill-ring' = anello 10 km attorno a Ruspino, [inizio-3h, inizio+3h] di ogni
# episodio (dati di studio per la pre-allerta; nessuna allerta li legge).
# AUTOMATICO: con 'continua' attivo, a fine run si rilancia da solo finché restano
# frame E il run ha archiviato qualcosa (i frame oltre la memoria dell'API DPC non
# bloccano: un run a 0 frame ferma la catena). Massimo 25 giri.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modalità'
        default: 'probe'
        type: choice
        options: ['probe', 'backfill-episodes', 'backfill-ring']
      max_frames:
        description: 'Frame massimi per run (backfill)'
        default: '400'
      auto:
        description: 'Continua da solo finché non ha finito'
        type: boolean
        default: true
      round:
        description: 'Giro (gestito in automatico, lasciare 1)'
        default: '1'

permissions:
  contents: write
  actions: write               # per rilanciare se stesso (workflow_dispatch)

concurrency:
  group: sri-backfill          # file separati (*_sri_backfill.csv): nessun conflitto con arpa-collect
  cancel-in-progress: false

jobs:
  sri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'archive/scripts/requirements.txt'
      - run: pip install -r archive/scripts/requirements.txt
      - name: SRI ${{ github.event.inputs.mode }} (giro ${{ inputs.round }})
        id: run
        env:
          SRI_MAX_FRAMES: ${{ github.event.inputs.max_frames }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "probe" ]; then
            python archive/scripts/sri_collect.py --probe
          elif [ "${{ github.event.inputs.mode }}" = "backfill-ring" ]; then
            python archive/scripts/sri_collect.py --backfill-ring
          else
            python archive/scripts/sri_collect.py --backfill-episodes
          fi
      - name: Commit SRI
        if: github.event.inputs.mode != 'probe'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/data/*_sri_backfill.csv 2>/dev/null || true
          git add archive/data/*_sri_ring_backfill.csv 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nessun frame nuovo."; else
            git commit -m "sri-backfill: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              git pull --rebase --autostash || true
              sleep $((i * 5))
            done
          fi
      - name: Continua automaticamente
        if: github.event.inputs.mode != 'probe' && inputs.auto
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          MAXF: ${{ inputs.max_frames }}
          ROUND: ${{ inputs.round }}
          PROGRESS: ${{ steps.run.outputs.progress }}
          REMAINING: ${{ steps.run.outputs.remaining }}
        run: |
          echo "giro $ROUND: archiviati ${PROGRESS:-0}, restano ${REMAINING:-0}"
          if [ "${REMAINING:-0}" -gt 0 ] && [ "${PROGRESS:-0}" -gt 0 ] && [ "$ROUND" -lt 25 ]; then
            gh workflow run sri-backfill.yml --ref main -f mode="$MODE" -f max_frames="$MAXF" \
              -f auto=true -f round=$((ROUND + 1))
            echo "rilanciato: giro $((ROUND + 1))"
          else
            echo "fine catena (finito, nessun progresso o limite giri)"
          fi
