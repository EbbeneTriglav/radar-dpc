name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Deploy SOLO quando cambiano i file del sito. I push dei workflow dati
    # (monitor/nowcast/arpa/forecast, decine al giorno) NON devono triggerare
    # deploy: GitHub Pages ha limiti di build/ora e la coda rendeva il sito
    # stantio. I dati vengono letti dai frontend via raw.githubusercontent.com
    # (sempre HEAD), quindi non serve ridistribuire il sito per aggiornarli.
    paths:
      - '**.html'
      - 'css/**'
      - 'js/**'
      - 'archive/areas.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache-bust assets with SHA
        run: |
          SHA="${GITHUB_SHA:0:8}"
          echo "Riscrivo ?v=... in tutti gli HTML con SHA=$SHA"
          find . -maxdepth 2 -name '*.html' -not -path './node_modules/*' -print0 | \
            xargs -0 sed -i -E "s/\\?v=[0-9a-zA-Z]+/?v=${SHA}/g"

      - name: Bypass Jekyll
        run: touch .nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
