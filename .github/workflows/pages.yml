name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache-bust assets with SHA
        run: |
          SHA="${GITHUB_SHA:0:8}"
          echo "Riscrivo ?v=... in tutti gli HTML con SHA=$SHA"
          find . -maxdepth 2 -name '*.html' -not -path './node_modules/*' -print0 | \
            xargs -0 sed -i -E "s/\\?v=[0-9a-zA-Z]+/?v=${SHA}/g"

      - name: Bypass Jekyll
        run: touch .nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
