<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar DPC — Monitoring sorgenti</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚨</text></svg>">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=20260518h">

  <style>
    body { overflow: hidden; }
    #monitor-app {
      position: fixed;
      top: 50px; left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      padding: 16px 20px;
      background: var(--bg);
    }
    .mon-grid { display: grid; grid-template-columns: 1fr; gap: 14px; max-width: 1200px; margin: 0 auto; }
    .mon-area-card { background: var(--bg2); border: 1px solid var(--border2); border-radius: 8px; padding: 14px; }
    .mon-area-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .mon-area-head h2 { margin: 0; font-size: 18px; color: var(--text); }
    .mon-area-status { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .status-ok       { background: #1e4d28; color: #b8f0c5; }
    .status-warning  { background: #5e4a0c; color: #ffd76b; }
    .status-alarm    { background: #6a2a14; color: #ffb38e; }
    .status-emergency{ background: #6e1830; color: #ff8aa8; }
    .status-loading  { background: #2a3140; color: #aab; }

    .mon-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
    @media (max-width: 800px) { .mon-row { grid-template-columns: 1fr; } }

    .mon-panel { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
    .mon-panel h3 { margin: 0 0 8px; font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
    .mon-bignum { font-size: 28px; font-weight: 700; color: var(--text); }
    .mon-bignum .mon-unit { font-size: 14px; color: var(--text3); margin-left: 4px; }
    .mon-subtle { font-size: 11px; color: var(--text3); margin-top: 4px; }

    .mon-thresh-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .mon-thresh-tag { padding: 3px 8px; border-radius: 10px; font-size: 10px; background: var(--bg2); border: 1px solid var(--border2); color: var(--text3); }
    .mon-thresh-tag.active { background: #6a2a14; color: #ffb38e; border-color: #c54521; }

    .mon-events { max-height: 200px; overflow-y: auto; }
    .mon-event { padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 12px; }
    .mon-event:last-child { border-bottom: 0; }
    .mon-event .lvl { display: inline-block; padding: 1px 6px; border-radius: 8px; font-size: 10px; margin-right: 6px; font-weight: 600; }
    .lvl-warning   { background: #5e4a0c; color: #ffd76b; }
    .lvl-alarm     { background: #6a2a14; color: #ffb38e; }
    .lvl-emergency { background: #6e1830; color: #ff8aa8; }

    .mon-chart-wrap { height: 220px; }

    .mon-noevents { color: var(--text3); font-size: 11px; padding: 8px; text-align: center; }
  </style>
</head>
<body>

<nav id="topbar">
  <div class="logo">
    <i class="fa fa-bell"></i>
    RADAR<span style="color:var(--text2);font-weight:300">·</span>MONITOR
  </div>
  <div class="nav-links">
    <a href="index.html" class="nav-link">🗺 Mappa Live</a>
    <a href="storico.html" class="nav-link">📊 Storico</a>
    <a href="archivio.html" class="nav-link">🗄 Archivio</a>
    <a href="monitor.html" class="nav-link active">🚨 Monitor</a>
  </div>
  <div class="spacer"></div>
  <button class="topbar-btn" id="btn-timezone" title="Cambia fuso orario">
    <i class="fa fa-globe"></i> <span class="tz-label">Locale</span>
  </button>
  <button class="topbar-btn" id="btn-refresh" title="Aggiorna ora">
    <i class="fa fa-sync"></i>
  </button>
</nav>

<div id="monitor-app">
  <div class="mon-grid" id="mon-grid">
    <div style="text-align:center;padding:40px;color:var(--text3)">
      <i class="fa fa-spinner fa-spin"></i> Caricamento configurazione…
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/timezone.js?v=20260518h"></script>
<script src="js/config.js?v=20260518h"></script>

<script>
// ─── Pagina Monitor — implementazione inline (no nuovo modulo, semplice) ─────

const AREAS_URL  = 'archive/areas.json';
const EVENTS_URL = 'archive/data/events.csv';
const OM_URL     = 'https://api.open-meteo.com/v1/forecast';

let _areas = [];
let _events = [];
let _charts = {};

async function init() {
  await loadAreas();
  await loadEvents();
  render();

  document.getElementById('btn-refresh')?.addEventListener('click', async () => {
    await loadEvents();
    render();
  });

  // Topbar TZ
  const tzBtn = document.getElementById('btn-timezone');
  function refreshTz() {
    const lbl = tzBtn?.querySelector('.tz-label');
    if (lbl) lbl.textContent = Timezone.mode === 'utc' ? 'UTC' : 'Locale';
  }
  refreshTz();
  tzBtn?.addEventListener('click', () => Timezone.toggle());
  window.addEventListener('timezone-changed', () => { refreshTz(); render(); });

  // Auto-refresh ogni 60 secondi (lato client) → ricarica eventi
  setInterval(async () => { await loadEvents(); render(); }, 60_000);
}

async function loadAreas() {
  try {
    const r = await fetch(AREAS_URL, { cache: 'no-cache' });
    const data = await r.json();
    _areas = (data.areas || []).filter(a => a.monitoring?.enabled);
  } catch (e) {
    console.error('areas load failed', e);
    _areas = [];
  }
}

async function loadEvents() {
  try {
    const r = await fetch(EVENTS_URL, { cache: 'no-cache' });
    if (!r.ok) { _events = []; return; }
    const text = await r.text();
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) { _events = []; return; }
    const headers = lines[0].split(',');
    _events = lines.slice(1).map(line => {
      const cells = line.split(',');
      const row = {};
      headers.forEach((h, i) => { row[h] = cells[i] || ''; });
      return row;
    });
  } catch (e) {
    _events = [];
  }
}

function render() {
  const grid = document.getElementById('mon-grid');
  if (!_areas.length) {
    grid.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text3)">
      <p><i class="fa fa-info-circle"></i> Nessuna area con monitoring attivo configurata.</p>
      <p style="font-size:11px">Imposta <code>monitoring.enabled = true</code> in <code>archive/areas.json</code>.</p>
    </div>`;
    return;
  }
  grid.innerHTML = _areas.map(a => renderAreaCard(a)).join('');
  _areas.forEach(a => { loadForecastChart(a); });
}

function renderAreaCard(area) {
  const mon = area.monitoring;
  const areaEvents = _events
    .filter(e => e.area_name === area.name)
    .sort((a, b) => b.event_timestamp_utc.localeCompare(a.event_timestamp_utc));

  // Stato corrente: il livello più alto ATTIVO non ancora "spento"
  // Visto che lo state file è server-side, lo deduciamo dall'ultimo evento delle ultime 2 ore
  const now = Date.now();
  const recentEvents = areaEvents.filter(e => {
    const t = new Date(e.event_timestamp_utc).getTime();
    return (now - t) < 2 * 3600_000;
  });
  const currentLevel = recentEvents.length
    ? recentEvents[0].level
    : 'ok';
  const statusLabel = {
    ok:        'OK',
    warning:   'WARNING',
    alarm:     'ALARM',
    emergency: 'EMERGENCY',
  }[currentLevel] || 'OK';

  const thresholds = mon.thresholds.map(t => {
    const isActive = recentEvents.some(e => e.level === t.level);
    return `<span class="mon-thresh-tag ${isActive ? 'active' : ''}">${t.icon} ${t.level.toUpperCase()} ≥ ${t.value_mm} mm/1h</span>`;
  }).join('');

  // Ultimo valore osservato dagli eventi (se ce ne sono)
  const lastObs = areaEvents[0];
  const lastValueMean = lastObs ? parseFloat(lastObs.observed_mm_mean).toFixed(1) : '—';
  const lastValueMax  = lastObs ? parseFloat(lastObs.observed_mm_max).toFixed(1) : '—';
  const lastObsTs = lastObs ? Timezone.formatDateTime(new Date(lastObs.observation_timestamp_utc).getTime()) : '—';

  // Lista eventi recenti (max 8)
  const eventsList = areaEvents.slice(0, 8).map(e => {
    const tsMs = new Date(e.event_timestamp_utc).getTime();
    const tsStr = Timezone.formatDateTime(tsMs);
    const emailIcon = e.notified_email === 'true' ? '✉️' : (e.notified_email === 'skipped' ? '' : '⚠️');
    const tgIcon    = e.notified_telegram === 'true' ? '✈️' : (e.notified_telegram === 'skipped' ? '' : '⚠️');
    return `<div class="mon-event">
      <span class="lvl lvl-${e.level}">${e.level}</span>
      <span>${parseFloat(e.observed_mm_mean).toFixed(1)} mm</span>
      <span style="color:var(--text3)"> ≥ ${e.threshold_mm}</span>
      <span style="float:right;color:var(--text3);font-size:10px">${tsStr} ${emailIcon}${tgIcon}</span>
    </div>`;
  }).join('') || `<div class="mon-noevents">Nessun evento registrato</div>`;

  return `
    <div class="mon-area-card">
      <div class="mon-area-head">
        <h2>📍 ${area.label}</h2>
        <span class="mon-area-status status-${currentLevel}">${statusLabel}</span>
        <span style="flex:1"></span>
        <span style="font-size:11px;color:var(--text3)">monitor: ${mon.product} • ${mon.metric || 'mean'}</span>
      </div>

      <div class="mon-thresh-list">${thresholds}</div>

      <div class="mon-row" style="margin-top:12px">
        <div class="mon-panel">
          <h3>Ultima osservazione</h3>
          <div class="mon-bignum">${lastValueMean} <span class="mon-unit">mm/1h (media)</span></div>
          <div class="mon-subtle">max ${lastValueMax} mm — ${lastObsTs}</div>
        </div>

        <div class="mon-panel">
          <h3>Forecast prossime 6h (OpenMeteo)</h3>
          <div class="mon-chart-wrap"><canvas id="forecast-${area.name}"></canvas></div>
        </div>
      </div>

      <div class="mon-panel" style="margin-top:12px">
        <h3>Eventi recenti</h3>
        <div class="mon-events">${eventsList}</div>
      </div>
    </div>
  `;
}

async function loadForecastChart(area) {
  const canvas = document.getElementById(`forecast-${area.name}`);
  if (!canvas) return;
  try {
    const r = await fetch(`${OM_URL}?latitude=${area.centroid.lat}&longitude=${area.centroid.lon}` +
      `&minutely_15=precipitation&forecast_minutes=360&timezone=UTC`);
    const data = await r.json();
    const times = data.minutely_15?.time || [];
    const prec  = data.minutely_15?.precipitation || [];
    if (!times.length) {
      canvas.parentElement.innerHTML = '<div class="mon-noevents">Forecast non disponibile</div>';
      return;
    }
    const labels = times.map(t => Timezone.formatShort(new Date(t + 'Z').getTime()));
    if (_charts[area.name]) _charts[area.name].destroy();
    _charts[area.name] = new Chart(canvas, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'Pioggia (mm/15min)',
          data: prec,
          backgroundColor: '#3eaaffcc',
          borderColor: '#3eaaff',
          borderWidth: 1,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#aaa', maxTicksLimit: 8 }, grid: { color: 'rgba(255,255,255,0.05)' } },
          y: { title: { display: true, text: 'mm/15min', color: '#aaa' },
               ticks: { color: '#aaa' },
               grid: { color: 'rgba(255,255,255,0.05)' } },
        },
      },
    });
  } catch (e) {
    console.warn('forecast', area.name, e);
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
