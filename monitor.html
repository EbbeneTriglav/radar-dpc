<script>
// ─── Monitor v2 ──────────────────────────────────────────────────────────────
// Dati letti da raw.githubusercontent.com@main (sempre HEAD): il deploy Pages
// non viene più rifatto ad ogni push dati, quindi i path relativi sarebbero
// stantii. fetchData() prova raw, poi fallback al path relativo (dev locale).
const RAW_BASE = 'https://raw.githubusercontent.com/EbbeneTriglav/radar-dpc/main/';
async function fetchData(path){
  if (location.hostname.endsWith('github.io')) {
    try {
      const r = await fetch(RAW_BASE + path + '?_=' + Date.now(), { cache: 'no-cache' });
      if (r.ok) return r;
    } catch {}
  }
  return fetch(path, { cache: 'no-cache' });
}
const AREAS_URL    = 'archive/areas.json';
const EVENTS_URL   = 'archive/data/events.csv';
const LAST_OBS_URL = 'archive/data/last_observations.json';
const OM_URL       = 'https://api.open-meteo.com/v1/forecast';
const LS_PREFIX    = 'radar-dpc.monitor.thresholds.';
const LS_PREFIX_RCPT = 'radar-dpc.monitor.recipients.';

let _areas = [];
let _events = [];
let _lastObs = {};      // {area: {SRT1:{...}, CUM3:{...}}}
let _archive = {};      // {area: {cum3: rows, cum24: rows}}
let _charts = {};
let _editing = {};
let _timing = 3;        // ore selezionate
let _archiveLoadedAt = 0;              // ms dell'ultimo caricamento CUM3/CUM24
const ARCHIVE_TTL_MS = 10 * 60_000;    // ricarica CUM3/CUM24 al massimo ogni 10'
const EXT_TTL_MS     = 10 * 60_000;    // cache 10' per OpenMeteo / MET Norway

// ── Tema (stessa convenzione delle altre pagine: localStorage 'radar-theme') ──
const themeBtn = document.getElementById('btn-theme');
function applyTheme(t){ document.body.classList.toggle('light-theme', t==='light');
  themeBtn.innerHTML = t==='light' ? '<i class="fa fa-sun"></i>' : '<i class="fa fa-moon"></i>'; }
applyTheme(localStorage.getItem('radar-theme')||'dark');
themeBtn.addEventListener('click',()=>{ const t=document.body.classList.contains('light-theme')?'dark':'light';
  localStorage.setItem('radar-theme',t); applyTheme(t); if (_areas.length) render(); });

// ── Parsing CSV minimale (gestisce virgolette) — stessa funzione di verifica.html ──
function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const split = l => { const out=[]; let cur='',q=false;
    for (const ch of l){ if(ch==='"'){q=!q;} else if(ch===','&&!q){out.push(cur);cur='';} else cur+=ch; }
    out.push(cur); return out; };
  const h = split(lines[0]);
  return lines.slice(1).map(l=>{ const c=split(l); const o={}; h.forEach((k,i)=>o[k]=c[i]??''); return o; });
}

// Numero da stringa CSV/JSON: '—' se mancante o non numerico (mai 0 inventato)
function fmtNum(v, d = 1){ const n = typeof v === 'number' ? v : parseFloat(v); return Number.isFinite(n) ? n.toFixed(d) : '—'; }

// ── Classificazione livelli events.csv ────────────────────────────────────
// observed  = soglie DPC (warning/alarm/emergency)       → stato osservato
// nowcast   = nowcast_<lv> (radar nel buffer, osservato)  → stato osservato
// storm_on  = storm_on_area ("cella su area")            → stato osservato, almeno warning
// storm_off = storm_cleared                               → chiude la cella, non è un'allerta
// forecast  = forecast_<lv> / forecast24h_<lv>           → SOLO badge "PREVISTO", mai stato osservato
const LEVEL_PRI = { warning: 1, alarm: 2, emergency: 3 };
function classifyEvent(e){
  const raw = e.level || '';
  if (raw === 'storm_on_area') return { kind: 'storm_on', lv: 'warning' };
  if (raw === 'storm_cleared') return { kind: 'storm_off', lv: null };
  const m = raw.match(/^(forecast24h_|forecast_|nowcast_)?(.*)$/);
  const pre = m[1] || '';
  const lv = LEVEL_PRI[m[2]] ? m[2] : null;
  const kind = pre.startsWith('forecast') ? 'forecast' : (pre === 'nowcast_' ? 'nowcast' : 'observed');
  return { kind, lv };
}

// ── Cache fetch esterni (OpenMeteo / MET Norway): 10' per URL ─────────────
const _extCache = new Map();   // url → { t, p }
function cachedJson(url){
  const c = _extCache.get(url);
  if (c && Date.now() - c.t < EXT_TTL_MS) return c.p;
  const p = fetch(url, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  _extCache.set(url, { t: Date.now(), p });
  p.catch(() => { if (_extCache.get(url)?.p === p) _extCache.delete(url); });  // gli errori non restano in cache
  return p;
}

// ── Colori grafico leggibili in entrambi i temi (da variabili CSS) ────────
function chartTheme(){
  const cs = getComputedStyle(document.body);
  const light = document.body.classList.contains('light-theme');
  return {
    text: cs.getPropertyValue('--text2').trim() || '#aaa',
    grid: light ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.05)',
  };
}

// ── Ultimi run dei workflow (ora italiana) ────────────────────────────────
const _fmtRome = new Intl.DateTimeFormat('it-IT', { timeZone: 'Europe/Rome', hour: '2-digit', minute: '2-digit' });
function renderRunInfo(){
  const el = document.getElementById('run-info');
  if (!el) return;
  const part = (lbl, iso, staleMin) => {
    const ms = Date.parse(iso || '');
    if (!Number.isFinite(ms)) return `<span>${lbl}: ultimo run —</span>`;
    const ago = Math.max(0, Math.round((Date.now() - ms) / 60000));
    const stale = staleMin != null && ago > staleMin;
    return `<span class="${stale ? 'run-stale' : ''}">${lbl}: ultimo run ${_fmtRome.format(ms)} (${ago} min fa)${stale ? ' ⚠️' : ''}</span>`;
  };
  el.innerHTML = part('Nowcast', _lastObs._nowcast_last_run_utc, 20) +
    (_lastObs._monitor_last_run_utc ? ' · ' + part('Monitor', _lastObs._monitor_last_run_utc, null) : '');
}

// ── Override storage ──────────────────────────────────────────────────────
function loadOverrides(n){ try{return JSON.parse(localStorage.getItem(LS_PREFIX+n)||'null');}catch{return null;} }
function saveOverrides(n,p){ localStorage.setItem(LS_PREFIX+n, JSON.stringify(p)); refreshOverridesBadge(); }
function clearAllOverrides(){ _areas.forEach(a => { localStorage.removeItem(LS_PREFIX+a.name); localStorage.removeItem(LS_PREFIX_RCPT+a.name); }); refreshOverridesBadge(); }
function hasAnyOverride(){ return _areas.some(a => localStorage.getItem(LS_PREFIX+a.name) || localStorage.getItem(LS_PREFIX_RCPT+a.name)); }

// Recipients (mailing list per area) — stesso pattern di override
function loadRecipients(n){ try{return JSON.parse(localStorage.getItem(LS_PREFIX_RCPT+n)||'null');}catch{return null;} }
function saveRecipientsLS(n,p){ localStorage.setItem(LS_PREFIX_RCPT+n, JSON.stringify(p)); refreshOverridesBadge(); }
function effectiveRecipients(area){
  return loadRecipients(area.name) || area.monitoring?.recipients || {email:[], telegram_chat_ids:[]};
}
function saveRecipients(name){
  // Legge i textarea con dataset.area === name e salva in localStorage
  const emTa = document.querySelector(`textarea.mon-rcpt-textarea[data-area="${name}"][data-kind="email"]`);
  const tgTa = document.querySelector(`textarea.mon-rcpt-textarea[data-area="${name}"][data-kind="tg"]`);
  if (!emTa || !tgTa) return;
  const splitLines = s => s.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  const r = {
    email: splitLines(emTa.value),
    telegram_chat_ids: splitLines(tgTa.value),
  };
  // Validazione basilare email
  const badEmails = r.email.filter(e => !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e));
  if (badEmails.length) {
    alert(`Email non valide:\n  ${badEmails.join('\n  ')}\n\nCorreggi e riprova.`);
    return;
  }
  saveRecipientsLS(name, r);
  alert(`✓ Destinatari salvati per ${name}.\nUsa "Esporta config" per generare il nuovo areas.json da committare.`);
}
window.saveRecipients = saveRecipients;
function refreshOverridesBadge(){
  document.getElementById('overrides-badge').style.display    = hasAnyOverride() ? '' : 'none';
  document.getElementById('btn-reset-overrides').style.display = hasAnyOverride() ? '' : 'none';
}
function effectiveProducts(area){
  return loadOverrides(area.name) || area.monitoring?.products || {};
}

// ── Init ──────────────────────────────────────────────────────────────────
async function init(){
  await Promise.all([loadAreas(), loadEvents(), loadLastObs()]);
  await loadArchiveForAll();
  render();
  refreshOverridesBadge();

  document.getElementById('btn-refresh').onclick = refreshAll;
  document.getElementById('btn-reset-overrides').onclick = () => {
    if (confirm('Cancella le modifiche locali e ripristina default?')) { clearAllOverrides(); render(); }
  };
  document.getElementById('timing-select').onchange = e => { _timing = parseInt(e.target.value, 10); render(); };

  const tzBtn = document.getElementById('btn-timezone');
  const refTz = () => { const l = tzBtn.querySelector('.tz-label'); if (l) l.textContent = Timezone.mode === 'utc' ? 'UTC' : 'Locale'; };
  refTz();
  tzBtn.onclick = () => Timezone.toggle();
  window.addEventListener('timezone-changed', () => { refTz(); render(); });

  setInterval(refreshAll, 60_000);
}

// Aggiorna eventi + ultime osservazioni; CUM3/CUM24 si ricaricano al massimo
// ogni ARCHIVE_TTL_MS (10'), OpenMeteo/MET sono in cache 10' (cachedJson).
async function refreshAll(){
  await Promise.all([loadEvents(), loadLastObs()]);
  await loadArchiveForAll();
  render();
}

async function loadAreas(){
  try {
    const r = await fetchData(AREAS_URL);
    const d = await r.json();
    _areas = (d.areas||[]).filter(a => a.monitoring?.enabled);
  } catch { _areas = []; }
}

async function loadEvents(){
  try {
    const r = await fetchData(EVENTS_URL);
    if (!r.ok) { _events = []; return; }
    _events = parseCSV(await r.text());
  } catch { _events = []; }
}

async function loadLastObs(){
  try {
    const r = await fetchData(LAST_OBS_URL);
    if (!r.ok) { _lastObs = {}; return; }
    _lastObs = await r.json();
  } catch { _lastObs = {}; }
}

async function loadArchiveForAll(){
  const stale = Date.now() - _archiveLoadedAt >= ARCHIVE_TTL_MS;
  if (!stale && _areas.every(a => _archive[a.name])) return;
  const next = stale ? {} : { ..._archive };
  for (const a of _areas) {
    if (next[a.name]) continue;
    next[a.name] = { cum3: await loadCsv(`archive/data/${a.name}_cum3.csv`),
                     cum24: await loadCsv(`archive/data/${a.name}_cum24.csv`) };
  }
  _archive = next;               // swap atomico: il render non vede mai un archivio a metà
  _archiveLoadedAt = Date.now();
}

async function loadCsv(url){
  try {
    const r = await fetchData(url);
    if (!r.ok) return [];
    return parseCSV(await r.text());
  } catch { return []; }
}

// ── Render ────────────────────────────────────────────────────────────────
function render(){
  const grid = document.getElementById('mon-grid');
  if (!_areas.length) {
    grid.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text3)">
      <i class="fa fa-info-circle"></i> Nessuna area con monitoring attivo.</div>`;
    return;
  }
  renderRunInfo();
  grid.innerHTML = _areas.map(renderAreaCard).join('');
  _areas.forEach(a => loadChart(a));
}

function renderAreaCard(area){
  const products = effectiveProducts(area);
  const isEditing = false; // modifica da pagina disabilitata (privacy destinatari)
  const isOverridden = !!loadOverrides(area.name);

  // Eventi recenti (ultime 2h)
  const areaEvents = _events.filter(e => e.area_name === area.name)
    .sort((a, b) => b.event_timestamp_utc.localeCompare(a.event_timestamp_utc));
  const now = Date.now();
  const recentEvents = areaEvents.filter(e => (now - new Date(e.event_timestamp_utc).getTime()) < 2 * 3600_000);

  // Stato corrente OSSERVATO (soglie DPC + nowcast + cella su area).
  // Le previsioni (forecast_/forecast24h_) NON guidano lo stato: badge separato "PREVISTO".
  const pri = LEVEL_PRI;
  let level = 'ok', fcLevel = null;
  recentEvents.forEach(e => {
    const c = classifyEvent(e);
    if (!c.lv) return;
    if (c.kind === 'forecast') { if ((pri[c.lv]||0) > (pri[fcLevel]||0)) fcLevel = c.lv; return; }
    if (c.kind === 'storm_on') return;   // gestita sotto (con storm_cleared)
    if ((pri[c.lv]||0) > (pri[level]||0)) level = c.lv;
  });
  // Cella su area: attiva se l'ultimo evento storm_* dell'area è storm_on_area
  // (non seguito da storm_cleared) ed è nella stessa finestra delle 2h.
  const lastStorm = areaEvents.find(e => e.level === 'storm_on_area' || e.level === 'storm_cleared');
  const stormOn = !!lastStorm && lastStorm.level === 'storm_on_area' && recentEvents.includes(lastStorm);
  if (stormOn && (pri[level]||0) < pri.warning) level = 'warning';
  const obsLevels = recentEvents.map(classifyEvent).filter(c => (c.kind === 'observed' || c.kind === 'nowcast') && c.lv);
  const statusParts = [];
  if (obsLevels.length) statusParts.push(level.toUpperCase());
  if (stormOn) statusParts.push('CELLA SU AREA');
  const statusText = statusParts.join(' · ') || 'OK';

  const productCards = Object.entries(products).map(([prod, cfg]) =>
    renderProductPanel(area, prod, cfg, recentEvents, isEditing)
  ).join('');

  const evList = areaEvents.slice(0, 6).map(e => {
    const tsStr = Timezone.formatDateTime(new Date(e.event_timestamp_utc).getTime());
    const c = classifyEvent(e);
    const isFc = c.kind === 'forecast';
    const lvText = c.kind === 'storm_on' ? 'cella su area' : c.kind === 'storm_off' ? 'cella uscita'
                 : (c.kind === 'nowcast' ? 'nowcast ' : '') + (c.lv || e.level);
    const icon = isFc ? '🔮' : c.kind === 'storm_on' ? '⛈️' : c.kind === 'storm_off' ? '🌤' : c.kind === 'nowcast' ? '📡' : '';
    const em = e.notified_email === 'true' ? '✉️' : (e.notified_email === 'skipped' ? '' : '⚠️');
    const tg = e.notified_telegram === 'true' ? '✈️' : (e.notified_telegram === 'skipped' ? '' : '⚠️');
    // SRI/ARPA e nowcast scattano sul MASSIMO d'area → si mostra il max (intensità);
    // CUM3/SRT1 (monitor) scattano sulla media → si mostra la media.
    const maxFirst = e.product === 'SRI' || e.product === 'ARPA' || c.kind === 'nowcast';
    const maxUnit = (e.product === 'SRI' || e.product === 'ARPA') ? 'mm/h' : 'mm';
    let val;
    if (isFc) val = `prev. ${fmtNum(e.forecast_max_6h_mm)} mm`;
    else if (maxFirst) val = `max ${fmtNum(e.observed_mm_max)} ${maxUnit}`;
    else if (Number.isFinite(parseFloat(e.observed_mm_mean)) || !Number.isFinite(parseFloat(e.observed_mm_max)))
      val = `${fmtNum(e.observed_mm_mean)} mm`;
    else val = `max ${fmtNum(e.observed_mm_max)} mm`;   // righe ricostruite: solo il max
    return `<div class="mon-event">
      <span class="lvl lvl-${e.level}">${icon}${lvText}</span>
      <span><b>${e.product}</b> ${val}</span>
      <span style="color:var(--text3)"> ≥ ${e.threshold_mm}</span>
      ${e.note ? `<span class="pred"> · ${String(e.note).replace(/\d+\.\d{3,}/g, v => (+v).toFixed(1))}</span>` : ''}
      <span style="float:right;color:var(--text3);font-size:10px">${tsStr} ${em}${tg}</span>
    </div>`;
  }).join('') || `<div class="mon-noevents">Nessun evento registrato</div>`;

  return `
    <div class="mon-area-card">
      <div class="mon-area-head">
        <h2>📍 ${area.label}</h2>
        <span class="mon-area-status status-${level}" title="Stato osservato (soglie DPC, nowcast, cella su area) — ultime 2h">${statusText}</span>
        ${fcLevel ? `<span class="mon-fc-badge fc-${fcLevel}" title="Allerta da PREVISIONE (non osservata) — ultime 2h">🔮 PREVISTO: ${fcLevel.toUpperCase()}</span>` : ''}
        ${isOverridden ? '<span class="mon-override-badge">soglie locali</span>' : ''}
        <span style="flex:1"></span>
      </div>

      <div class="mon-prod-row">${productCards}</div>

      <div class="mon-recipients">
        <span class="mon-recipients-label">📬 Destinatari notifiche:</span>
        ${(function(){
          const eff = effectiveRecipients(area);
          const em = eff.email || [];
          const tg = eff.telegram_chat_ids || [];
          if (isEditing) {
            return `
              <div class="mon-rcpt-edit-row">
                <label>✉️ Email (uno per riga):</label>
                <textarea class="mon-rcpt-textarea" data-area="${area.name}" data-kind="email"
                          rows="2" placeholder="(vuoto = usa SMTP_TO globale)">${em.join('\n')}</textarea>
              </div>
              <div class="mon-rcpt-edit-row">
                <label>💬 Telegram chat ID (uno per riga):</label>
                <textarea class="mon-rcpt-textarea" data-area="${area.name}" data-kind="tg"
                          rows="2" placeholder="(vuoto = usa TELEGRAM_CHAT_ID globale)">${tg.join('\n')}</textarea>
              </div>
              <button class="btn-sm" onclick="saveRecipients('${area.name}')">
                <i class="fa fa-save"></i> Salva localmente
              </button>`;
          }
          const emTxt = em.length ? `${em.length} indirizz${em.length === 1 ? 'o' : 'i'}` : '<i>default globale (SMTP_TO)</i>';
          const tgTxt = tg.length ? `${tg.length} chat ID` : '<i>default globale (TELEGRAM_CHAT_ID)</i>';
          return `<span class="mon-recipients-item">✉️ ${emTxt}</span>
                  <span class="mon-recipients-item">💬 ${tgTxt}</span>`;
        })()}
        <span class="mon-recipients-hint" title="Soglie e destinatari si gestiscono in archive/areas.json nel repo.">
          <i class="fa fa-info-circle"></i>
        </span>
      </div>

      <div class="mon-prod-row" style="margin-top:10px">
        <div class="mon-panel">
          <h3>📊 Grafico ${_timing === 24 ? 'CUM24 · ultimi 7 giorni' : '±' + _timing + 'h'} <span class="pill" id="pill-${area.name}">${_timing === 24 ? 'CUM24 DPC (pluviometri)' : 'DPC'}</span></h3>
          <div class="mon-chart-wrap"><canvas id="chart-${area.name}"></canvas></div>
        </div>
        <div class="mon-panel">
          <h3>📜 Eventi recenti</h3>
          <div class="mon-events">${evList}</div>
        </div>
      </div>
    </div>
  `;
}

function renderProductPanel(area, prod, cfg, recentEvents, isEditing){
  const unit = prod === 'SRT1' ? 'mm/1h' : 'mm/3h';
  const thresholds = cfg.thresholds || [];

  // Ultimo valore: da last_observations.json
  const obs = _lastObs[area.name]?.[prod];
  let valueHtml;
  if (obs) {
    // Dato vecchio: SRT1 (orario, aggiornato ogni ~10') > 30 min; CUM3 (blocchi 3h + latenza) > 4 h
    const staleMs = prod === 'SRT1' ? 30 * 60_000 : prod === 'CUM3' ? 4 * 3600_000 : 6 * 3600_000;
    const obsMs = new Date(obs.timestamp_utc).getTime();
    const isStale = !Number.isFinite(obsMs) || (Date.now() - obsMs) > staleMs;
    valueHtml = `
      <div class="mon-bignum ${isStale ? 'stale' : ''}">${fmtNum(obs.mean)} <span class="mon-unit">${unit} (media)</span></div>
      <div class="mon-subtle">max ${fmtNum(obs.max)} mm · ${Number.isFinite(obsMs) ? Timezone.formatDateTime(obsMs) : '—'}${isStale ? ' · <span style="color:var(--warn)">⚠️ dato non aggiornato</span>' : ''}</div>
    `;
  } else {
    valueHtml = `<div class="mon-na">In attesa primo aggiornamento dal workflow…</div>`;
  }

  // Riga forecast: OpenMeteo + MET Norway (dal last_observations.forecast)
  let fcHtml = '';
  const fc = _lastObs[area.name]?.forecast;
  if (fc) {
    const key = prod === 'SRT1' ? 'max_1h' : 'max_3h';
    const om = fc.openmeteo?.[key];
    const mt = fc.metno?.[key];
    const fmt = v => fmtNum(v);
    const both = Number.isFinite(om) && Number.isFinite(mt);
    const hz = Number.isFinite(fc.horizon_hours) ? ` nelle prossime ${fc.horizon_hours}h` : '';
    fcHtml = `<div class="mon-subtle" style="margin-top:4px">
      🔮 max ${prod === 'SRT1' ? '1h' : '3h'}${hz}: OM <b>${fmt(om)}</b> · MET <b>${fmt(mt)}</b> mm
      ${both ? '<span style="color:#82b1ff">· dati da 2 modelli</span>' : '<span style="color:#888">· in attesa MET</span>'}
    </div>`;
  }

  // Tag soglia: "active" solo per eventi OSSERVATI (soglia DPC o nowcast);
  // un evento previsto marca il tag in tratteggio ("fc"), mai come attivo.
  const tags = thresholds.map(t => {
    const match = kind => recentEvents.some(e => { const c = classifyEvent(e);
      return e.product === prod && c.lv === t.level && kind.includes(c.kind); });
    const active = match(['observed', 'nowcast']);
    const fcOnly = !active && match(['forecast']);
    return `<span class="mon-thresh-tag ${active ? 'active' : fcOnly ? 'fc' : ''}"${fcOnly ? ' title="Soglia superata solo in PREVISIONE"' : ''}>${t.icon} ${t.level} ≥ ${t.value_mm}${fcOnly ? ' (prev.)' : ''}</span>`;
  }).join('');

  const editor = !isEditing ? '' : thresholds.map((t, i) => `
    <label>${t.icon} ${t.level}</label>
    <input type="number" step="0.5" min="0" value="${t.value_mm}"
      data-area="${area.name}" data-prod="${prod}" data-idx="${i}"
      onchange="updateThreshold(this)">
  `).join('');

  return `
    <div class="mon-panel">
      <h3>${prod} <span class="pill" title="${prod === 'SRT1' ? 'SRT1 DPC: radar SRI integrato con i pluviometri a terra' : 'CUM3 DPC: SOLO pluviometri a terra interpolati (non radar)'}">${prod === 'SRT1' ? '1h radar+pluvio' : '3h pluviometri'}</span></h3>
      ${valueHtml}
      ${fcHtml}
      <div class="mon-thresh-list">${tags}</div>
      ${isEditing ? `<div class="mon-edit-row">${editor}</div>` : ''}
    </div>
  `;
}

// ── Grafico DPC osservato + OpenMeteo + MET Norway ────────────────────────
// Finestra [now−H, now+H]. Unità omogenea: INTENSITÀ MEDIA mm/h
//   CUM3 DPC (mm/3h) ÷ 3 · SRT1 DPC (mm/1h) as is · OpenMeteo 15' (mm/15min) × 4 · MET 1h (mm/1h) as is.
// Vista 24h: SOLO CUM24 DPC (mm/24h, ultimi 7 giorni), senza previsioni (unità non confrontabili).
async function loadChart(area){
  const canvas = document.getElementById(`chart-${area.name}`);
  if (!canvas) return;

  const H = _timing;
  const nowMs = Date.now();
  const is24 = H === 24;
  const t0 = is24 ? nowMs - 7 * 86400_000 : nowMs - H * 3600_000;
  const t1 = is24 ? nowMs : nowMs + H * 3600_000;
  const inWin = d => d.ts >= t0 && d.ts <= t1;

  const dpc = buildDpcSeries(area, H);
  const dpcSeries = dpc.series.filter(inWin);

  let omSeries = [], metSeries = [];
  if (!is24) {
    try {
      const data = await cachedJson(`${OM_URL}?latitude=${area.centroid.lat}&longitude=${area.centroid.lon}` +
        `&minutely_15=precipitation&past_minutely_15=${H * 4}&forecast_minutes=${H * 60}&timezone=UTC`);
      const times = data.minutely_15?.time || [];
      const prec  = data.minutely_15?.precipitation || [];
      omSeries = times.map((t, i) => {
        const v = prec[i] ?? null;                       // valore mancante → null, mai 0
        return { ts: new Date(t + 'Z').getTime(), v: Number.isFinite(v) ? +(v * 4).toFixed(2) : null };
      }).filter(inWin);
    } catch (e) { console.warn('OM fetch err', area.name, e); }

    // MET Norway forecast (granularità oraria: next_1_hours = mm nell'ora → mm/h)
    try {
      const data = await cachedJson(`https://api.met.no/weatherapi/locationforecast/2.0/compact` +
        `?lat=${area.centroid.lat.toFixed(4)}&lon=${area.centroid.lon.toFixed(4)}`);
      const ts = data.properties?.timeseries || [];
      metSeries = ts.map(e => {
        const det = e.data?.next_1_hours?.details;
        if (!det || !Number.isFinite(det.precipitation_amount)) return null;
        return { ts: new Date(e.time).getTime(), v: det.precipitation_amount };
      }).filter(Boolean).filter(inWin);
    } catch (e) { console.warn('MET fetch err', area.name, e); }
  }

  // Il canvas può essere stato sostituito da un render() più recente durante i fetch
  if (!canvas.isConnected) return;

  const hasOm  = omSeries.some(d => d.v != null);
  const hasMet = metSeries.length > 0;
  const pill = document.getElementById(`pill-${area.name}`);
  if (pill) pill.textContent = is24 ? dpc.label
    : ['DPC', hasOm ? 'OpenMeteo' : null, hasMet ? 'MET Norway' : null].filter(Boolean).join(' + ');

  // Unifica timeline
  const allTs = new Set();
  dpcSeries.forEach(d => allTs.add(d.ts));
  omSeries.forEach(d => allTs.add(d.ts));
  metSeries.forEach(d => allTs.add(d.ts));
  const tsList = [...allTs].sort((a, b) => a - b);
  const labels = tsList.map(t => Timezone.formatShort(t));
  const dpcMap = new Map(dpcSeries.map(d => [d.ts, d.v]));
  const omMap  = new Map(omSeries.map(d => [d.ts, d.v]));
  const metMap = new Map(metSeries.map(d => [d.ts, d.v]));
  const dpcData = tsList.map(t => dpcMap.has(t) ? dpcMap.get(t) : null);
  const omData  = tsList.map(t => omMap.has(t) ? omMap.get(t) : null);
  const metData = tsList.map(t => metMap.has(t) ? metMap.get(t) : null);
  const unit = is24 ? 'mm/24h' : 'mm/h';
  const th = chartTheme();

  const datasets = [
    { type: 'bar', label: dpc.label,
      data: dpcData, backgroundColor: '#7bed9fcc', borderColor: '#7bed9f', borderWidth: 1 },
  ];
  if (!is24) datasets.push(
    { type: 'line', label: 'OpenMeteo 15\' (×4 → mm/h)',
      data: omData, borderColor: '#82b1ff', backgroundColor: '#82b1ff44',
      tension: 0.3, pointRadius: 1, fill: true,
      segment: {
        borderDash: ctx => (tsList[ctx.p1DataIndex] > nowMs) ? [5, 4] : undefined,
      },
    },
    { type: 'line', label: 'MET Norway 1h (forecast)',
      data: metData, borderColor: '#ff9f6b', backgroundColor: 'transparent',
      tension: 0.3, pointRadius: 2, borderDash: [3, 3], fill: false, spanGaps: true },
  );

  if (_charts[area.name]) _charts[area.name].destroy();
  _charts[area.name] = new Chart(canvas, {
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: th.text, font: { size: 10 } }, position: 'bottom' },
        tooltip: {
          backgroundColor: 'rgba(20,20,30,0.95)',
          titleColor: '#fff', bodyColor: '#ddd', borderColor: '#444', borderWidth: 1,
          callbacks: {
            title: items => {
              const idx = items[0].dataIndex;
              const ts = tsList[idx];
              const isFuture = ts > nowMs;
              return (isFuture ? '🔮 ' : '📊 ') + Timezone.formatDateTime(ts);
            },
            label: item => {
              if (item.parsed.y == null) return null;
              return `${item.dataset.label}: ${item.parsed.y.toFixed(2)} ${unit}`;
            },
          },
        },
      },
      scales: {
        x: { ticks: { color: th.text, maxTicksLimit: 12, autoSkip: true,
                     callback: function(v, i){
                       const ts = tsList[i];
                       if (ts == null) return '';
                       // mostra data + ora per i tick
                       return Timezone.format(ts, { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
                     } },
             grid: { color: th.grid } },
        y: { title: { display: true, text: is24 ? 'mm/24h (CUM24 DPC)' : 'mm/h (intensità media)', color: th.text },
             ticks: { color: th.text },
             grid: { color: th.grid },
             beginAtZero: true },
      },
    },
  });
}

// Serie DPC osservata (barre). Valori mancanti/non numerici → null (barra assente), mai 0.
function buildDpcSeries(area, timing){
  const cum3 = (_archive[area.name]?.cum3 || []).filter(r => r.location_type === 'area');
  const cum24 = (_archive[area.name]?.cum24 || []).filter(r => r.location_type === 'area');
  const lastSRT1 = _lastObs[area.name]?.SRT1;
  const lastCUM3 = _lastObs[area.name]?.CUM3;
  const num = v => { const n = typeof v === 'number' ? v : parseFloat(v); return Number.isFinite(n) ? n : null; };

  let series = [], label;
  if (timing === 24) {
    label = 'CUM24 DPC (pluviometri)';
    series = cum24.map(r => ({ ts: new Date(r.timestamp_utc).getTime(), v: num(r.mean) }));
  } else if (timing === 1) {
    label = 'SRT1 DPC (radar+pluviometri)';
    if (lastSRT1) series = [{ ts: new Date(lastSRT1.timestamp_utc).getTime(), v: num(lastSRT1.mean) }];
  } else {
    // 3h / 6h / 12h → serie CUM3 (mm/3h ÷ 3 = mm/h medi sul blocco) + ultimo valore live
    label = 'CUM3 DPC (pluviometri) ÷3 → mm/h';
    const toRate = v => v == null ? null : +(v / 3).toFixed(2);
    series = cum3.map(r => ({ ts: new Date(r.timestamp_utc).getTime(), v: toRate(num(r.mean)) }));
    if (lastCUM3) {
      const ts = new Date(lastCUM3.timestamp_utc).getTime();
      if (!series.some(d => d.ts === ts)) series.push({ ts, v: toRate(num(lastCUM3.mean)) });
    }
  }
  series = series.filter(d => Number.isFinite(d.ts));
  return { label, series: series.sort((a,b) => a.ts - b.ts) };
}

// ── Editor ───────────────────────────────────────────────────────────────
function toggleEdit(name){ _editing[name] = !_editing[name]; render(); }
function updateThreshold(input){
  const a = input.dataset.area, p = input.dataset.prod, i = parseInt(input.dataset.idx, 10);
  const v = parseFloat(input.value);
  if (!isFinite(v) || v < 0) return;
  const area = _areas.find(x => x.name === a);
  let ov = loadOverrides(a) || JSON.parse(JSON.stringify(area.monitoring.products));
  if (ov[p]?.thresholds[i]) { ov[p].thresholds[i].value_mm = v; saveOverrides(a, ov); }
}
window.toggleEdit = toggleEdit;
window.updateThreshold = updateThreshold;

document.addEventListener('DOMContentLoaded', init);
</script>
